<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            height: 500px;
            background-color: aquamarine;
        }
        .header,.footer{
            border: 1px solid black;
            height: 20%;
            background-color: rgb(240,115,115);
        }
        .center{
            height: 60%;
            background-color: brown;
            display: flex;
        }
        .left{
            height: 100%;
            width: 20%;
            background-color: rgb(88, 209, 209);
        }
        .right{
            height: 100%;
            width: 80%;
            background-color: rgb(92, 125, 155);
        }
        .top{
            height: 50%;
            background-color: rgb(187, 233, 127);
        }
        .bottom{
            height: 50%;
            background-color: blueviolet;
            display: flex;
        }
        .b1{
            height: 100%;
            width: 50%;
            background-color: blanchedalmond;
        }
        .b2{
            width: 50%;
            height: 100%;
            background-color: royalblue;
            display: flex;
        }
       
    </style>
</head>
<body>
    <h1 align="center">Flex Box</h1>
    <div class="con">
        <div class="header"></div>
        <div class="center">
            <div class="left"></div>
            <div class="right">
                <div class="top"></div>
                <div class="bottom">
                    <div class="b1"></div>
                    <div class="b2">
                        <div class="b11"></div>
                        <div class="b22"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
